name: Deploy to GitHub Pages

env:
  PROJECT_PATH: LoadingIndicators.Avalonia.Demo/LoadingIndicators.Avalonia.Demo.Browser/LoadingIndicators.Avalonia.Demo.Browser.csproj

on:
  push:
    branches: [ master ]
  # Builds on pull requests too (without deploying), so a change that breaks the browser demo
  # fails its PR instead of reaching the live site.
  pull_request:

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The runner image also ships a newer SDK, and with no global.json `dotnet` picks the newest.
      # On SDK 11, `wasm-tools` installs only the net11 toolchain, so net10.0-browser publishes
      # without linking SkiaSharp/HarfBuzz into dotnet.native.wasm, and the demo dies at startup
      # (TypeInitializationException: SkiaSharp.SKImageInfo). Pinning this job to the SDK set up
      # above keeps `wasm-tools` matched to the target framework.
      - name: Pin the .NET 10 SDK
        run: |
          echo '{ "sdk": { "version": "${{ steps.setup-dotnet.outputs.dotnet-version }}", "rollForward": "disable" } }' > global.json
          dotnet --version

      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      # WasmBuildNative=true turns a missing or mismatched toolchain into a build error
      # (NETSDK1147) instead of a "successful" deploy of a demo that cannot start.
      - name: Publish .NET Project
        run: dotnet publish $PROJECT_PATH -c Release -o release --nologo -p:WasmBuildNative=true

      - name: Clean up _framework for static hosting
        run: |
          cd release/wwwroot/_framework
          # Remove pre-compressed files (GitHub Pages handles compression)
          rm -f *.br *.gz
          # Strip fingerprint hashes: Name.HASH.ext -> Name.ext
          for f in *.*.*; do
            if [ -f "$f" ]; then
              base=$(echo "$f" | sed -E 's/\.[a-z0-9]{10,}\.(wasm|js|dat)$/.\1/')
              if [ "$base" != "$f" ]; then
                cp "$f" "$base"
              fi
            fi
          done

      - name: Remove pre-compressed files from root
        run: rm -f release/wwwroot/*.br release/wwwroot/*.gz

      - name: copy index.html to 404.html
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Add .nojekyll file
        run: touch release/wwwroot/.nojekyll

      - name: Uploading files to gh-pages branch
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: release/wwwroot
